<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bodegón El Buen Sabor - Asistente Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Encabezado con identidad del negocio -->
        <div class="chat-header">
            <div class="header-avatar">🛒</div>
            <div class="header-info">
                <h1>Bodegón El Buen Sabor</h1>
                <span class="status-dot"></span><span class="status-text">En línea</span>
            </div>
        </div>

        <!-- Área de mensajes con scroll -->
        <div id="chat-box" class="chat-box">
            <div class="message bot-message">¡Hola! Bienvenido al Bodegón El Buen Sabor. ¿En qué puedo ayudarte hoy?</div>
        </div>

        <!-- Formulario de entrada -->
        <form id="chat-form" class="chat-form">
            <input type="text" id="user-input" placeholder="Escribe tu pregunta aquí..." autocomplete="off" required>
            <button type="submit">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
